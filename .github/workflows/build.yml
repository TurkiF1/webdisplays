name: Build NeoForge 1.21.11

on:
  push:
    branches: [neoforge-1.21.11]
  pull_request:
    branches: [neoforge-1.21.11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Verify packaged client startup configuration
        run: |
          MOD_JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$MOD_JAR"
          unzip -p "$MOD_JAR" webdisplays.mixins.json > packaged-mixins.json
          ! grep -Eq '"(MouseHandlerMixin|OverlayMixin)"' packaged-mixins.json
          ! rg -U '@SubscribeEvent\s+public\s+static' src/main/java
      - name: Smoke-test NeoForge server startup
        run: |
          mkdir -p run-server
          echo 'eula=true' > run-server/eula.txt
          set +e
          timeout 90s ./gradlew runServer --nogui --stacktrace > server-smoke.log 2>&1
          STATUS=$?
          cat server-smoke.log
          if [ "$STATUS" -ne 124 ]; then exit "$STATUS"; fi
          grep -q 'Done (' run-server/logs/latest.log
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: webdisplays-neoforge-1.21.11
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
