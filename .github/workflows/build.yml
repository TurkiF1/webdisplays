name: Build NeoForge 1.21.11

on:
  push:
    branches: [neoforge-1.21.11]
  pull_request:
    branches: [neoforge-1.21.11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: webdisplays-neoforge-1.21.11
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
