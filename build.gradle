plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.13'
}

version = mod_version
group = maven_group
base.archivesName = archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources { srcDir 'src/generated/resources' }

if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
    minecraft.accessTransformers.file file('src/main/resources/META-INF/accesstransformer.cfg')
}

runs {
    configureEach {
        modSource sourceSets.main
        systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        systemProperty 'neoforge.enabledGameTestNamespaces', 'webdisplays'
    }
    client { workingDirectory project.file('run') }
    server {
        workingDirectory project.file('run-server')
        arguments.add('--nogui')
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // MCEF 2.2.0 for Minecraft 1.21.11. It supplies the actual Chromium browser.
    implementation('curse.maven:mcef-keksuccino-1366156:7587822') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'WebDisplays',
                'Specification-Vendor': 'CinemaMod Group and contributors',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'WebDisplays community fork',
                'MixinConfigs': 'webdisplays.mixins.json'
        ])
    }
}
