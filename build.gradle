plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = mod_version
group = maven_group
base.archivesName = archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'webdisplays'
        }
        register('client')
        register('server') { args '--nogui' }
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', 'webdisplays', '--all', '--output',
                    layout.projectDirectory.dir('src/generated/resources'), '--existing',
                    layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://mcef-download.cinemamod.com/repositories/releases/' }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'

    // Temporary API bridge while MCEF is ported to Forge 1.21.11.
    // This old binary must never be shipped in a release build.
    compileOnly('com.cinemamod:mcef-forge:2.1.6-1.20.1') { transitive = false }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest {
        attributes([
                'Specification-Title': 'WebDisplays',
                'Specification-Vendor': 'CinemaMod Group and contributors',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'WebDisplays community fork',
                'MixinConfigs': 'webdisplays.mixins.json'
        ])
    }
}
